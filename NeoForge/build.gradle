buildscript {
    dependencies {
        classpath 'gradle.plugin.com.github.johnrengelman:shadow:7.1.2'
    }
}

plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}
apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'com.github.johnrengelman.shadow'

jarJar.enable()

archivesBaseName = "${build_file_name}-Neoforge-${minecraft_version}"


minecraft.accessTransformers.file file("src/main/resources/META-INF/accesstransformer.cfg")
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main

        dependencies {
            runtime "com.esotericsoftware.yamlbeans:yamlbeans:1.17"
            runtime "com.twelvemonkeys.imageio:imageio-webp:${twelvemonkeys_version}"
        }
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        workingDirectory project.file('run/client')
        // ./gradlew :NeoForge:runClient -PtestJoin=localhost  -> joins a local test server directly
        if (project.hasProperty('testJoin')) {
            programArguments.addAll '--quickPlayMultiplayer', project.property('testJoin')
        }
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        workingDirectory project.file('run/server')
        programArgument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}


sourceSets.main.resources.srcDir 'src/generated/resources'


tasks.named('jarJar') {

}

tasks.named("build").configure {
    dependsOn("jarJar")
}

// NeoForge 21.1.x ships ASM 9.8 on the module path; make the dev run classpath use the same version
// (NeoGradle 7.0.145 otherwise puts ASM 9.5 next to it and the dev launcher refuses to start).
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') {
            details.useVersion '9.8'
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation group: "com.esotericsoftware.yamlbeans", name: "yamlbeans", version: "1.17"
    jarJar group: "com.esotericsoftware.yamlbeans", name: "yamlbeans", version: "[1.17]"
    // WebP decoding (TwelveMonkeys ImageIO) and its runtime dependencies, nested into the mod jar
    [
        "com.twelvemonkeys.imageio:imageio-webp",
        "com.twelvemonkeys.imageio:imageio-core",
        "com.twelvemonkeys.imageio:imageio-metadata",
        "com.twelvemonkeys.common:common-lang",
        "com.twelvemonkeys.common:common-io",
        "com.twelvemonkeys.common:common-image",
    ].each { lib ->
        def (g, n) = lib.split(':')
        implementation group: g, name: n, version: twelvemonkeys_version
        jarJar group: g, name: n, version: "[${twelvemonkeys_version}]"
    }
    compileOnly project(":Common")
}

subsystems {
    parchment {
        minecraftVersion="1.21"
        mappingsVersion="2024.07.07"
    }
}



// NeoGradle compiles the game, but we don't want to add our common code to the game's code
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") && !it.name.contains("Test") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
    source(project(":Common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
    source(project(":Common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project(":Common").sourceSets.main.allSource)
}

processResources {
    from project(":Common").sourceSets.main.resources
}

